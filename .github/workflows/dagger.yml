name: dagger

on:
  # Run on pushes to any branch (remove when narrowing to specific branches).
  push:
  # Allow running manually from the Actions tab. For manual runs you can force
  # the suites to use a local checkout of the lws10/ test definitions
  # (instead of the default tests.yaml from the `yaml` branch of
  # elf-pavlik/lws-test-suite) by setting tests_path, e.g. "lws-test-suite/lws10".
  workflow_dispatch:
    inputs:
      tests_path:
        description: >-
          Force use of a local copy of the lws10/ test definitions by passing
          a relative path (from the workspace root) to them, e.g.
          "lws-test-suite/lws10". The tests repo is checked out on the
          runner as ./lws-test-suite. Leave empty to use the remote default.
        required: false
        default: ""
      tests_repo:
        description: Repository to check out for the local tests copy.
        required: false
        default: elf-pavlik/lws-test-suite
      tests_ref:
        description: Branch/ref of the tests repo (default branch if empty).
        required: false
        default: yaml

jobs:
  conformance:
    name: ${{ matrix.harness }} / ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      # Each suite x implementation cell passes / fails independently; a red
      # cell must never cancel the other cells.
      fail-fast: false
      matrix:
        harness: [touchstone, lws-net]
        server: [lws-server, sparq, halcyon]
        # The lws-net x sparq cell is currently red (Solid vs LWS surface), as
        # are both halcyon cells: the LWS.net harness never sends an
        # Authorization header, so Halcyon (ACP; anonymous never granted)
        # answers 401 to every request, and the touchstone cell is red until
        # Halcyon-next's surface matches the suite the harness reads.
        # Uncomment to drop a cell from the run until it conforms:
        # exclude:
        #   - harness: lws-net
        #     server: sparq
        #   - harness: lws-net
        #     server: halcyon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: used only for manual runs that force a local tests copy
      # (tests_path input). Checked out at ./lws-test-suite so that a
      # relative path like "lws-test-suite/lws10" resolves from the workspace
      # root when passed to --tests below.
      - name: Checkout local tests (optional)
        if: inputs.tests_path != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tests_repo }}
          ref: ${{ inputs.tests_ref }}
          path: lws-test-suite

      - name: Run suite
        uses: dagger/dagger-for-github@v8.3.0
        with:
          # Aligned with the local devbox setup (dagger-engine-v0.21.9).
          version: v0.21.9
          verb: call
          # Single line on purpose: this action version writes `args` into
          # GITHUB_OUTPUT, whose format rejects embedded newlines — a multiline
          # `args: |` makes every job fail with "Invalid format ...".
          # The trailing expression appends "--tests <path>" only when a
          # local tests path is provided for a manual run.
          args: test --harness ${{ matrix.harness }} --server ${{ matrix.server }}${{ inputs.tests_path != '' && format(' --tests {0}', inputs.tests_path) || '' }}
          # Optional: send traces to Dagger Cloud. Add a repository secret
          # named DAGGER_CLOUD_TOKEN and uncomment:
          # cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}